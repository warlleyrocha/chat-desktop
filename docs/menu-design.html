<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Chat Desktop — Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: oklch(0.21 0.012 250);
        --bg-elev: oklch(0.24 0.013 250);
        --hover: oklch(0.27 0.015 250);
        --divider: oklch(0.3 0.012 250);
        --text: oklch(0.96 0.005 250);
        --text-dim: oklch(0.62 0.012 250);
        --text-faint: oklch(0.48 0.012 250);
        --accent: oklch(0.74 0.13 230);
        --avatar: oklch(0.66 0.13 155);
        --stage: oklch(0.16 0.012 250);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--stage);
        color: var(--text);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        font-feature-settings: 'cv11', 'ss01';
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      /* ---------- side menu ---------- */
      .menu {
        width: 269px;
        height: 1024px;
        background: var(--bg);
        border-radius: 2px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        box-shadow:
          0 24px 60px -20px rgba(0, 0, 0, 0.6),
          0 4px 16px rgba(0, 0, 0, 0.3);
      }

      /* profile block */
      .profile {
        padding: 20px 16px 18px;
      }
      .profile-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .avatar {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--avatar);
        display: grid;
        place-items: center;
        color: white;
        font-weight: 600;
        font-size: 19px;
        letter-spacing: 0.2px;
        flex-shrink: 0;
        user-select: none;
      }
      .profile-spacer {
        flex: 1;
      }
      .chevron {
        width: 18px;
        height: 18px;
        color: var(--text-faint);
        transition: transform 0.25s ease;
        cursor: pointer;
      }
      .chevron:hover {
        color: var(--text-dim);
      }
      .chevron.flipped {
        transform: rotate(180deg);
      }

      .profile-name {
        margin-top: 14px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.1px;
      }
      .profile-sub {
        margin-top: 3px;
        font-size: 13px;
        color: var(--accent);
        font-weight: 400;
        cursor: pointer;
      }
      .profile-sub:hover {
        text-decoration: underline;
      }

      .divider {
        height: 1px;
        background: var(--divider);
        margin: 4px 0;
      }

      /* item list */
      .items {
        display: flex;
        flex-direction: column;
        padding: 6px 0;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 10px 22px;
        cursor: pointer;
        color: var(--text);
        font-size: 14px;
        font-weight: 400;
        transition: background 0.12s ease;
        user-select: none;
        position: relative;
      }
      .item:hover {
        background: var(--hover);
      }
      .item:active {
        background: var(--bg-elev);
      }

      .item svg {
        width: 21px;
        height: 21px;
        flex-shrink: 0;
        color: var(--text);
        stroke-width: 1.6;
      }

      .item-label {
        flex: 1;
        line-height: 1;
      }

      /* toggle */
      .toggle {
        width: 36px;
        height: 20px;
        border-radius: 999px;
        background: oklch(0.38 0.012 250);
        position: relative;
        cursor: pointer;
        transition: background 0.2s ease;
        flex-shrink: 0;
      }
      .toggle::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .toggle.on {
        background: var(--accent);
      }
      .toggle.on::after {
        transform: translateX(16px);
      }

      /* footer */
      .footer {
        margin-top: auto;
        padding: 20px 22px 22px;
        font-size: 12px;
        color: var(--text-faint);
        line-height: 1.6;
      }
      .footer .about {
        color: var(--accent);
        cursor: pointer;
      }
      .footer .about:hover {
        text-decoration: underline;
      }

      /* sub-menu on chevron expand */
      .submenu {
        display: none;
        flex-direction: column;
        background: var(--bg-elev);
        border-bottom: 1px solid var(--divider);
        overflow: hidden;
      }
      .submenu.open {
        display: flex;
      }
      .sub-item {
        padding: 10px 22px;
        font-size: 13px;
        color: var(--text-dim);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 14px;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      .sub-item:hover {
        background: var(--hover);
        color: var(--text);
      }
      .sub-item .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.5;
      }

      /* light theme override when toggle off */
      .menu.light {
        --bg: oklch(0.985 0.002 250);
        --bg-elev: oklch(0.96 0.003 250);
        --hover: oklch(0.94 0.005 250);
        --divider: oklch(0.9 0.005 250);
        --text: oklch(0.2 0.012 250);
        --text-dim: oklch(0.46 0.012 250);
        --text-faint: oklch(0.62 0.01 250);
      }
    </style>
  </head>
  <body>
    <div class="stage" data-screen-label="01 Side Menu">
      <div class="menu" id="menu" data-comment-anchor="side-menu">
        <!-- profile -->
        <div class="profile">
          <div class="profile-row">
            <div class="avatar" aria-label="Avatar">WR</div>
            <div class="profile-spacer"></div>
            <svg
              class="chevron"
              id="chev"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="profile-name">Warley Rocha</div>
          <div class="profile-sub">Emoji de Status</div>
        </div>

        <!-- expanded account submenu -->
        <div class="submenu" id="submenu">
          <div class="sub-item"><span class="dot"></span>Adicionar conta</div>
          <div class="sub-item"><span class="dot"></span>Trocar de conta</div>
          <div class="sub-item"><span class="dot"></span>Sair</div>
        </div>

        <div class="divider"></div>

        <!-- profile item (alone) -->
        <div class="items" style="padding-bottom: 0">
          <div class="item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9"></circle>
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M6.5 19c1-2.4 3.2-4 5.5-4s4.5 1.6 5.5 4"></path>
            </svg>
            <span class="item-label">Meu Perfil</span>
          </div>
        </div>

        <div class="divider"></div>

        <!-- main list -->
        <div class="items">
          <div class="item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="9" cy="9" r="3"></circle>
              <path d="M3 19c1-3 3.2-4.5 6-4.5S14 16 15 19"></path>
              <circle cx="17" cy="8" r="2.5"></circle>
              <path d="M15 13.2c.6-.2 1.3-.3 2-.3 2 0 3.5 1 4 3"></path>
            </svg>
            <span class="item-label">Novo Grupo</span>
          </div>

          <div class="item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 10v4l11 4V6L4 10z"></path>
              <path d="M4 10H3a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h1"></path>
              <path d="M18 8c1.5 1 1.5 7 0 8"></path>
              <path d="M9 18l1 3h2l-1-3"></path>
            </svg>
            <span class="item-label">Novo Canal</span>
          </div>

          <div class="item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="9" r="3.2"></circle>
              <path d="M5.5 19c1-3 3.6-4.5 6.5-4.5s5.5 1.5 6.5 4.5"></path>
            </svg>
            <span class="item-label">Contatos</span>
          </div>

          <div class="item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M5 4.5c0-.8.7-1.5 1.5-1.5h2L10 7l-2 1.5c1 2.5 3 4.5 5.5 5.5L15 12l3.5 1.5v2c0 .8-.7 1.5-1.5 1.5C10.6 17 5 11.4 5 4.5z"
              ></path>
            </svg>
            <span class="item-label">Chamadas</span>
          </div>

          <div class="item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 3.5h12v17l-6-4-6 4v-17z"></path>
            </svg>
            <span class="item-label">Mensagens Salvas</span>
          </div>

          <div class="item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="2.8"></circle>
              <path
                d="M19.4 13.6a1.5 1.5 0 0 1 .3 1.7l-.6 1a1.5 1.5 0 0 1-1.6.7l-1.3-.3a7.4 7.4 0 0 1-1.8 1l-.4 1.3a1.5 1.5 0 0 1-1.4 1.1h-1.2a1.5 1.5 0 0 1-1.4-1.1l-.4-1.3a7.4 7.4 0 0 1-1.8-1l-1.3.3a1.5 1.5 0 0 1-1.6-.7l-.6-1a1.5 1.5 0 0 1 .3-1.7l1-.9a7.4 7.4 0 0 1 0-2.1l-1-.9a1.5 1.5 0 0 1-.3-1.7l.6-1a1.5 1.5 0 0 1 1.6-.7l1.3.3a7.4 7.4 0 0 1 1.8-1l.4-1.3A1.5 1.5 0 0 1 11.4 3h1.2a1.5 1.5 0 0 1 1.4 1.1l.4 1.3a7.4 7.4 0 0 1 1.8 1l1.3-.3a1.5 1.5 0 0 1 1.6.7l.6 1a1.5 1.5 0 0 1-.3 1.7l-1 .9a7.4 7.4 0 0 1 0 2.1l1 1z"
              ></path>
            </svg>
            <span class="item-label">Configurações</span>
          </div>

          <div class="item" id="nightItem">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"></path>
            </svg>
            <span class="item-label">Modo Noturno</span>
            <div class="toggle on" id="nightToggle" role="switch" aria-checked="true"></div>
          </div>
        </div>

        <!-- footer -->
        <div class="footer">
          <div>Chat Desktop</div>
          <div>Versão 6.8.2 – <span class="about">Sobre</span></div>
        </div>
      </div>
    </div>

    <script>
      // chevron toggles account submenu
      const chev = document.getElementById('chev');
      const submenu = document.getElementById('submenu');
      chev.addEventListener('click', () => {
        chev.classList.toggle('flipped');
        submenu.classList.toggle('open');
      });

      // night-mode toggle
      const menu = document.getElementById('menu');
      const toggle = document.getElementById('nightToggle');
      const nightItem = document.getElementById('nightItem');

      function setNight(on) {
        toggle.classList.toggle('on', on);
        menu.classList.toggle('light', !on);
        toggle.setAttribute('aria-checked', String(on));
      }

      // clicking the row toggles, but don't double-fire when clicking toggle directly
      nightItem.addEventListener('click', (e) => {
        if (e.target === toggle) return;
        setNight(!toggle.classList.contains('on'));
      });
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        setNight(!toggle.classList.contains('on'));
      });
    </script>
  </body>
</html>
