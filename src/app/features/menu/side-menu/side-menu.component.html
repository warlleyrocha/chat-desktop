<div class="backdrop" [class.open]="menu.isOpen()" (click)="menu.close()">
  <aside
    class="menu bg-sidebar text-foreground"
    (click)="$event.stopPropagation()"
    aria-label="Menu da conta"
  >
    <div class="profile px-4 pt-5 pb-4">
      <div class="flex items-center gap-3">
        <div
          class="avatar grid h-13.5 w-13.5 place-items-center rounded-full bg-primary font-semibold text-white select-none"
          aria-label="Avatar"
        >
          {{ account.initials }}
        </div>
        <div class="flex-1"></div>
        <svg
          class="chevron h-4.5 w-4.5 cursor-pointer text-foreground-muted hover:text-foreground-secondary"
          [class.flipped]="accountExpanded()"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          (click)="toggleAccount()"
        >
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <div class="mt-3.5 text-[15px] leading-tight font-semibold">{{ account.name }}</div>
      <div class="mt-1 cursor-pointer text-[13px] text-primary hover:underline">
        {{ account.status }}
      </div>
    </div>

    <div class="submenu bg-surface" [class.open]="accountExpanded()">
      <div class="sub-item flex cursor-pointer items-center gap-3.5 px-5.5 py-2.5 text-[13px] text-foreground-secondary hover:bg-card hover:text-foreground">
        <span class="dot h-1.5 w-1.5 rounded-full bg-current opacity-50"></span>Adicionar conta
      </div>
      <div class="sub-item flex cursor-pointer items-center gap-3.5 px-5.5 py-2.5 text-[13px] text-foreground-secondary hover:bg-card hover:text-foreground">
        <span class="dot h-1.5 w-1.5 rounded-full bg-current opacity-50"></span>Trocar de conta
      </div>
      <div class="sub-item flex cursor-pointer items-center gap-3.5 px-5.5 py-2.5 text-[13px] text-foreground-secondary hover:bg-card hover:text-foreground">
        <span class="dot h-1.5 w-1.5 rounded-full bg-current opacity-50"></span>Sair
      </div>
    </div>

    <div class="h-px bg-border"></div>

    <div class="flex flex-col py-1.5">
      <div class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card">
        <svg class="h-5.25 w-5.25 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="10" r="3"></circle>
          <path d="M6.5 19c1-2.4 3.2-4 5.5-4s4.5 1.6 5.5 4"></path>
        </svg>
        <span class="flex-1 leading-none">Meu Perfil</span>
      </div>
    </div>

    <div class="h-px bg-border"></div>

    <div class="flex flex-col py-1.5">
      <div class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card">
        <svg class="h-5.25 w-5.25 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="9" r="3"></circle>
          <path d="M3 19c1-3 3.2-4.5 6-4.5S14 16 15 19"></path>
          <circle cx="17" cy="8" r="2.5"></circle>
          <path d="M15 13.2c.6-.2 1.3-.3 2-.3 2 0 3.5 1 4 3"></path>
        </svg>
        <span class="flex-1 leading-none">Novo Grupo</span>
      </div>

      <div class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card">
        <svg class="h-5.25 w-5.25 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10v4l11 4V6L4 10z"></path>
          <path d="M4 10H3a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h1"></path>
          <path d="M18 8c1.5 1 1.5 7 0 8"></path>
          <path d="M9 18l1 3h2l-1-3"></path>
        </svg>
        <span class="flex-1 leading-none">Novo Canal</span>
      </div>

      <div class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card">
        <svg class="h-5.25 w-5.25 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="9" r="3.2"></circle>
          <path d="M5.5 19c1-3 3.6-4.5 6.5-4.5s5.5 1.5 6.5 4.5"></path>
        </svg>
        <span class="flex-1 leading-none">Contatos</span>
      </div>

      <div class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card">
        <svg class="h-5.25 w-5.25 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 4.5c0-.8.7-1.5 1.5-1.5h2L10 7l-2 1.5c1 2.5 3 4.5 5.5 5.5L15 12l3.5 1.5v2c0 .8-.7 1.5-1.5 1.5C10.6 17 5 11.4 5 4.5z"></path>
        </svg>
        <span class="flex-1 leading-none">Chamadas</span>
      </div>

      <div class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card">
        <svg class="h-5.25 w-5.25 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3.5h12v17l-6-4-6 4v-17z"></path>
        </svg>
        <span class="flex-1 leading-none">Mensagens Salvas</span>
      </div>

      <div class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card">
        <svg class="h-5.25 w-5.25 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="2.8"></circle>
          <path d="M19.4 13.6a1.5 1.5 0 0 1 .3 1.7l-.6 1a1.5 1.5 0 0 1-1.6.7l-1.3-.3a7.4 7.4 0 0 1-1.8 1l-.4 1.3a1.5 1.5 0 0 1-1.4 1.1h-1.2a1.5 1.5 0 0 1-1.4-1.1l-.4-1.3a7.4 7.4 0 0 1-1.8-1l-1.3.3a1.5 1.5 0 0 1-1.6-.7l-.6-1a1.5 1.5 0 0 1 .3-1.7l1-.9a7.4 7.4 0 0 1 0-2.1l-1-.9a1.5 1.5 0 0 1-.3-1.7l.6-1a1.5 1.5 0 0 1 1.6-.7l1.3.3a7.4 7.4 0 0 1 1.8-1l.4-1.3A1.5 1.5 0 0 1 11.4 3h1.2a1.5 1.5 0 0 1 1.4 1.1l.4 1.3a7.4 7.4 0 0 1 1.8 1l1.3-.3a1.5 1.5 0 0 1 1.6.7l.6 1a1.5 1.5 0 0 1-.3 1.7l-1 .9a7.4 7.4 0 0 1 0 2.1l1 1z"></path>
        </svg>
        <span class="flex-1 leading-none">Configurações</span>
      </div>

      <div
        class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card"
        (click)="theme.toggle()"
      >
        <svg class="h-5.25 w-5.25 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"></path>
        </svg>
        <span class="flex-1 leading-none">Modo Noturno</span>
        <div
          class="toggle bg-foreground-muted/40"
          [class.on]="theme.isDark()"
          role="switch"
          [attr.aria-checked]="theme.isDark()"
          (click)="$event.stopPropagation(); theme.toggle()"
        ></div>
      </div>
    </div>

    <div class="footer mt-auto px-5.5 pt-5 pb-5.5 text-xs leading-relaxed text-foreground-muted">
      <div>Chat Desktop</div>
      <div>Versão {{ account.appVersion }} – <span class="about cursor-pointer text-primary hover:underline">Sobre</span></div>
    </div>
  </aside>
</div>
