<div class="backdrop" [class.open]="menu.isOpen()">
  <aside
    class="menu bg-sidebar text-foreground"
    aria-label="Menu da conta"
  >
    <div class="profile px-4 pt-5 pb-4">
      <div class="flex items-center gap-3">
        <div
          class="avatar grid h-13.5 w-13.5 place-items-center rounded-full bg-primary font-semibold text-white select-none"
          aria-label="Avatar"
        >
          {{ account.initials }}
        </div>
        <div class="flex-1"></div>
        <button
          type="button"
          class="chevron h-4.5 w-4.5 cursor-pointer border-0 bg-transparent p-0 text-foreground-muted hover:text-foreground-secondary"
          [class.flipped]="accountExpanded()"
          aria-label="Expandir conta"
          [attr.aria-expanded]="accountExpanded()"
          (click)="toggleAccount()"
        >
          <svg lucideChevronDown class="h-full w-full" aria-hidden="true"></svg>
        </button>
      </div>
      <div class="mt-3.5 text-[15px] leading-tight font-semibold">{{ account.name }}</div>
    </div>

    <div class="submenu bg-surface" [class.open]="accountExpanded()">
      <div
        class="sub-item flex cursor-pointer items-center gap-3.5 px-5.5 py-2.5 text-[13px] text-foreground-secondary hover:bg-card hover:text-foreground"
      >
        <span class="dot h-1.5 w-1.5 rounded-full bg-current opacity-50"></span>Adicionar conta
      </div>
      <div
        class="sub-item flex cursor-pointer items-center gap-3.5 px-5.5 py-2.5 text-[13px] text-foreground-secondary hover:bg-card hover:text-foreground"
      >
        <span class="dot h-1.5 w-1.5 rounded-full bg-current opacity-50"></span>Trocar de conta
      </div>
      <div
        class="sub-item flex cursor-pointer items-center gap-3.5 px-5.5 py-2.5 text-[13px] text-foreground-secondary hover:bg-card hover:text-foreground"
      >
        <span class="dot h-1.5 w-1.5 rounded-full bg-current opacity-50"></span>Sair
      </div>
    </div>

    <div class="h-px bg-border"></div>

    <div class="flex flex-col py-1.5">
      <div
        class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card"
      >
        <svg lucideCircleUser class="h-5.25 w-5.25 shrink-0" aria-hidden="true"></svg>
        <span class="flex-1 leading-none">Meu Perfil</span>
      </div>
    </div>

    <div class="h-px bg-border"></div>

    <div class="flex flex-col py-1.5">
      <div
        class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card"
      >
        <svg lucideUsers class="h-5.25 w-5.25 shrink-0" aria-hidden="true"></svg>
        <span class="flex-1 leading-none">Novo Grupo</span>
      </div>

      <div
        class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card"
      >
        <svg lucideMegaphone class="h-5.25 w-5.25 shrink-0" aria-hidden="true"></svg>
        <span class="flex-1 leading-none">Novo Canal</span>
      </div>

      <div
        class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card"
      >
        <svg lucideUser class="h-5.25 w-5.25 shrink-0" aria-hidden="true"></svg>
        <span class="flex-1 leading-none">Contatos</span>
      </div>

      <div
        class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card"
      >
        <svg lucidePhone class="h-5.25 w-5.25 shrink-0" aria-hidden="true"></svg>
        <span class="flex-1 leading-none">Chamadas</span>
      </div>

      <div
        class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card"
      >
        <svg lucideBookmark class="h-5.25 w-5.25 shrink-0" aria-hidden="true"></svg>
        <span class="flex-1 leading-none">Mensagens Salvas</span>
      </div>

      <div
        class="item flex cursor-pointer items-center gap-4.5 px-5.5 py-2.5 text-sm select-none hover:bg-card"
      >
        <svg lucideSettings class="h-5.25 w-5.25 shrink-0" aria-hidden="true"></svg>
        <span class="flex-1 leading-none">Configurações</span>
      </div>

      <button
        type="button"
        class="item flex w-full cursor-pointer items-center gap-4.5 border-0 bg-transparent px-5.5 py-2.5 text-sm text-foreground select-none hover:bg-card"
        (click)="theme.toggle()"
      >
        <svg lucideMoon class="h-5.25 w-5.25 shrink-0" aria-hidden="true"></svg>
        <span class="flex-1 leading-none">Modo Noturno</span>
        <div
          class="toggle bg-foreground-muted/40"
          [class.on]="theme.isDark()"
          role="switch"
          tabindex="0"
          aria-label="Modo noturno"
          [attr.aria-checked]="theme.isDark()"
          (click)="$event.stopPropagation(); theme.toggle()"
          (keydown.space)="$event.preventDefault(); $event.stopPropagation(); theme.toggle()"
        ></div>
      </button>
    </div>

    <div class="footer mt-auto px-5.5 pt-5 pb-5.5 text-xs leading-relaxed text-foreground-muted">
      <div>Chat Desktop</div>
      <div>
        Versão {{ account.appVersion }} –
        <span class="about cursor-pointer text-primary hover:underline">Sobre</span>
      </div>
    </div>
  </aside>
</div>
